name: Smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar paquete
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/IamJony/eval-unpacker.git
          pip install -e .

      - name: Verificar eval-unpacker
        run: |
          which eval-unpacker || echo "⚠️ eval-unpacker NO encontrado"
          eval-unpacker --help || true

      - name: Autotest offline
        run: streamvid --test

      - name: Smoke test
        run: python scripts/smoke_test.py
        continue-on-error: true

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json docs/status.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar estado [skip ci]"
            git push
          else
            echo "Sin cambios"
          fi
